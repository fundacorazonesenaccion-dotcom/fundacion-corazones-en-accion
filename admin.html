<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración | Corazones en Acción</title><style>
:root{font-family:system-ui,Arial;background:#f5f8fc;color:#1d2c3c}*{box-sizing:border-box}body{margin:0}.bar{background:#1e5fa8;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1150px;margin:32px auto;padding:0 16px}h1{font-size:24px}button{background:#1e5fa8;border:0;color:#fff;padding:10px 18px;border-radius:8px;cursor:pointer}button.secondary{background:#506072}input,select,textarea{padding:10px;border:1px solid #cad8e8;border-radius:8px;font:inherit}input{width:100%}label{display:block;margin:12px 0} .card{border:1px solid #deebf6;border-radius:12px;background:white;padding:20px;margin:12px 0}#login{max-width:420px;margin:auto}#app{display:none}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{border-collapse:collapse;width:100%}td,th{padding:12px;border-bottom:1px solid #e6eef7;text-align:left;vertical-align:top}th{background:#eef5fc}.small{font-size:12px;color:#526473}.scroll{overflow:auto}details{max-width:320px;white-space:pre-wrap;overflow-wrap:anywhere}#message{color:#b4232f}@media(max-width:700px){td,th{font-size:12px;padding:8px}}
</style></head><body><div class="bar"><strong>Corazones en Acción · Administración</strong><button id="logout" class="secondary" style="display:none">Salir</button></div><main><section id="login" class="card"><h1>Acceso al panel</h1><p>Ingresa la contraseña administrativa configurada en el servidor.</p><form id="loginForm"><label>Contraseña<input id="pwd" type="password" required autocomplete="current-password"></label><button type="submit">Entrar</button></form></section><section id="app"><h1>Panel de solicitudes</h1><p id="modeBanner" class="small" role="status">Comprobando modo de operación…</p><button id="downloadBackup" type="button" class="secondary">Descargar respaldo cifrado</button><p class="small">Datos consultados directamente desde Turso a través de la API segura.</p><div class="card filters"><label>Tipo <select id="filter"><option value="">Todos</option><option value="reporte_caso">Reportes</option><option value="apadrinamiento">Donaciones</option><option value="voluntariado">Voluntariado</option></select></label><button id="reload">Actualizar</button><span id="counter"></span></div><div class="card scroll"><table><thead><tr><th>Fecha</th><th>Tipo / Persona</th><th>Detalles</th><th>Gestión</th></tr></thead><tbody id="records"></tbody></table></div></section><p role="status" id="message"></p></main><script>
const $=s=>document.querySelector(s);let items=[];
async function api(route,options){const res=await fetch(route,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options?.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Error de servidor');return data;}
function node(tag,text){const el=document.createElement(tag);el.textContent=text??'';return el;}
function loginMode(inSession){$('#login').style.display=inSession?'none':'block';$('#app').style.display=inSession?'block':'none';$('#logout').style.display=inSession?'inline':'none';}
function render(){const filtered=items.filter(r=>!$('#filter').value||r.tipo===$('#filter').value);$('#counter').textContent=filtered.length+' solicitudes';const tbody=$('#records');tbody.replaceChildren();if(!filtered.length){const td=node('td','No hay solicitudes para mostrar.');td.colSpan=4;const tr=node('tr');tr.append(td);tbody.append(tr);}for(const r of filtered){const tr=node('tr');tr.append(node('td',new Date(r.created_at).toLocaleString('es-CO')),node('td',r.tipo+'\n'+(r.nombre||'Anónimo')));const detail=node('td');const d=node('details'),summary=node('summary','Ver datos');d.append(summary,node('pre',JSON.stringify(JSON.parse(r.detalles||'{}'),null,2)));detail.append(d);tr.append(detail);const manage=node('td'),select=node('select');for(const value of ['pendiente','en_gestion','cerrada']){const op=node('option',value.replace('_',' '));op.value=value;select.append(op);}select.value=r.estado;const notes=node('textarea');notes.rows=2;notes.placeholder='Nota interna';notes.value=r.nota||'';const save=node('button','Guardar');save.onclick=async()=>{try{await api('/api/admin/solicitudes/'+encodeURIComponent(r.id),{method:'PATCH',body:JSON.stringify({estado:select.value,nota:notes.value})});$('#message').textContent='Cambios guardados';await load();}catch(e){$('#message').textContent=e.message}};manage.append(select,notes,save);tr.append(manage);tbody.append(tr);}}
async function load(){try{const data=await api('/api/admin/solicitudes');items=data.items||[];render();}catch(e){$('#message').textContent=e.message;if(e.message.includes('autorizada'))loginMode(false);}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#pwd').value})});$('#pwd').value='';$('#message').textContent='';loginMode(true);await load();}catch(err){$('#message').textContent=err.message;}};$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'}).catch(()=>{});loginMode(false);items=[]};$('#downloadBackup').onclick=async()=>{try{const res=await fetch('/api/admin/backup',{credentials:'same-origin',cache:'no-store'});if(!res.ok)throw new Error((await res.json()).error||'Error de respaldo');const b=await res.blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='corazones-backup-'+new Date().toISOString().slice(0,10)+'.encrypted.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);$('#message').textContent='Respaldo cifrado descargado. Guarda la clave aparte.';}catch(e){$('#message').textContent=e.message;}};
fetch('/api/public/status',{cache:'no-store'}).then(r=>r.json()).then(s=>{$('#modeBanner').textContent=s.modo==='pruebas'?'MODO PRUEBAS: no utilizar datos personales reales.':'PRODUCCIÓN: solicitudes reales habilitadas.';});
$('#reload').onclick=load;$('#filter').onchange=render;api('/api/admin/session').then(()=>{loginMode(true);load();}).catch(()=>loginMode(false));
</script></body></html>
